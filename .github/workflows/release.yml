name: release

# 打 tag（v1.2.3）触发：三平台各构建一次，产物挂到 GitHub Release。
# Wails v2 不支持交叉编译，必须在目标系统上构建。
#
# macOS 签名/公证是**可选**的：仓库里没有配置 Apple 开发者密钥时自动跳过，
# 产物保持未签名（README 说明了首次打开的办法）。要启用签名，需要配置这些 secrets：
#   MACOS_CERTIFICATE_P12        Developer ID Application 证书的 base64（base64 -i cert.p12）
#   MACOS_CERTIFICATE_PASSWORD   该 .p12 的导出密码
#   MACOS_SIGN_IDENTITY          例如 "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                     Apple ID 邮箱（公证用）
#   APPLE_APP_SPECIFIC_PASSWORD  App 专用密码（appleid.apple.com 生成）
#   APPLE_TEAM_ID                团队 ID
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
  MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: dsh-desktop-windows-amd64.zip
            setup: dsh-desktop-windows-amd64-setup.exe
          - os: macos-latest
            platform: darwin/universal
            asset: dsh-desktop-macos-universal.zip
          - os: ubuntu-22.04
            platform: linux/amd64
            asset: dsh-desktop-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # windows-latest 镜像自带 NSIS。要点：choco 装完后 **不会** 自动进 PATH，
      # 而 wails 只在 PATH 里找 makensis，找不到会静默跳过安装器生成（只打一行
      # 警告、退出码仍为 0），所以这里必须把目录写进 GITHUB_PATH。
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            choco install nsis -y --no-progress
          }
          Add-Content $env:GITHUB_PATH $nsisDir

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # -nsis 额外产出 build/bin/dsh-desktop-amd64-installer.exe
      - name: Build (wails)
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="-nsis"; fi
          wails build -platform "${{ matrix.platform }}" -skipbindings $EXTRA

      # ---- macOS 签名 / 公证（有 secrets 才执行，否则保持未签名） ----
      - name: Import code-signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          # 临时钥匙串的密码随机生成，只活在这个一次性 runner 上。
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign and notarize
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          APP=build/bin/dsh-desktop.app
          # --deep 已被 Apple 标记为弃用，但对 Wails 这种没有内嵌 framework 的
          # 单层 .app 仍是可靠的实用做法；hardened runtime 由 --options runtime 打开。
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-to-notarize.zip"
          xcrun notarytool store-credentials DSH_NOTARY_PROFILE \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun notarytool submit "$RUNNER_TEMP/app-to-notarize.zip" \
            --keychain-profile DSH_NOTARY_PROFILE --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Clean up keychain
        if: runner.os == 'macOS' && always()
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

      # ---- 打包（必须在签名/公证之后，让发布包里是已盖章的 .app） ----
      - name: Package
        shell: bash
        run: |
          cd build/bin
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto 的 --sequesterRiff 在新版 macOS 上已不存在，无需它。
            ditto -c -k --keepParent dsh-desktop.app "../../${{ matrix.asset }}"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../../${{ matrix.asset }}" dsh-desktop.exe
            # 安装器文件名由 NSIS 模板决定，用通配避免与命名规则耦合。
            cp dsh-desktop-*-installer.exe "../../${{ matrix.setup }}"
          else
            tar -czf "../../${{ matrix.asset }}" dsh-desktop
          fi

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      # Windows 额外产出 NSIS 安装器，作为独立 asset 上传。
      # 不能和上面的合并成一个 upload：macOS/Linux 没有安装器，
      # 空 path 会让 upload-artifact 直接报错。
      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.setup }}
          path: ${{ matrix.setup }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
            *setup.exe
