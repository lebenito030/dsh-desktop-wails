name: release

# 打 tag（v1.2.3）触发：三平台各构建一次，产物挂到 GitHub Release。
# Wails v2 不支持交叉编译，必须在目标系统上构建。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: dsh-desktop-windows-amd64.zip
          - os: macos-latest
            platform: darwin/universal
            asset: dsh-desktop-macos-universal.zip
          - os: ubuntu-22.04
            platform: linux/amd64
            asset: dsh-desktop-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build (wails)
        shell: bash
        run: wails build -platform "${{ matrix.platform }}" -skipbindings

      # macOS 产物是 .app 目录；未做签名/公证，README 里写了首次打开的办法。
      - name: Package
        shell: bash
        run: |
          cd build/bin
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRiff --keepParent dsh-desktop.app "../../${{ matrix.asset }}"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../../${{ matrix.asset }}" dsh-desktop.exe
          else
            tar -czf "../../${{ matrix.asset }}" dsh-desktop
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
